<div
  class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 bg-slate-100 text-slate-900 font-sans selection:bg-blue-600 selection:text-white">

  <div
    class="w-full max-w-sm bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-200/60 overflow-hidden">

    <div class="h-1.5 w-full bg-[#0091CA]"></div>

    <div class="p-6 sm:p-8 space-y-6">
      <div class="text-center space-y-3">
        <div class="h-16 max-w-[220px] mx-auto flex items-center justify-center p-1">
          <img src="gtorresytorres_logo.jpg" alt="G Torres y Torres Logo"
            class="max-h-full max-w-full object-contain" />
        </div>

        <div class="space-y-1">
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">Iniciar Sesión</h1>
          <p class="text-xs text-slate-500 font-medium">Ingresa tus credenciales</p>
        </div>
      </div>

      @if (notification()) {
      <div class="text-xs p-3 rounded-xl border flex items-center gap-2.5 animate-fadeIn"
        [class]="notification()?.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'">
        @if (notification()?.type === 'success') {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-emerald-600" viewBox="0 0 20 20"
          fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z"
            clip-rule="evenodd" />
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 text-rose-600" viewBox="0 0 20 20"
          fill="currentColor">
          <path fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z"
            clip-rule="evenodd" />
        </svg>
        }
        <span class="leading-snug font-medium">{{ notification()?.text }}</span>
      </div>
      }

      <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">

        <app-input label="Correo corporativo" type="email" placeholder="usuario@empresa.com" icon="email"
          [(value)]="email" [errorMessage]="emailError()" />

        <app-input label="Contraseña" type="password" placeholder="••••••••" icon="lock" [(value)]="password"
          [errorMessage]="passwordError()" />

        <div class="pt-2">
          <app-button type="submit" variant="primary" label="Iniciar sesión" [loading]="isLoading()" />
        </div>

      </form>
    </div>

  </div>

  <router-outlet></router-outlet>
</div>
