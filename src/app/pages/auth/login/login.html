<div class="space-y-5">

  @if (errorMessage()) {
  <div
    class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-center gap-2.5 animate-fadeIn font-medium">
    <svg class="w-4 h-4 shrink-0 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ errorMessage() }}</span>
  </div>
  }

  <form (submit)="$event.preventDefault(); onLogin()" class="space-y-4">

    <app-input label="Correo electrónico" type="email" placeholder="mail@correo.com" icon="email" [(value)]="email" />

    <app-input label="Contraseña" type="password" placeholder="••••••••" icon="lock" [(value)]="password" />


    <div class="pt-7">
      <app-button type="submit" label="Iniciar sesión" variant="primary" [loading]="loading()" />
    </div>

  </form>

  <div class="pt-3 border-t border-slate-100 text-center text-xs text-slate-500">
    ¿No tienes una cuenta aún?
    <a routerLink="/register" class="text-[#0091CA] hover:text-[#007BB0] font-semibold ml-1 transition hover:underline">
      Regístrate aquí
    </a>
  </div>

</div>
