<div
  class="min-h-screen bg-slate-50 flex font-sans text-slate-800 antialiased selection:bg-[#0091CA] selection:text-white">

  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 fixed inset-y-0 z-30 shadow-sm">
    <div class="h-20 flex items-center px-6 border-b border-slate-100">
      <img src="gtorresytorres_logo.jpg" alt="Torres y Torres" class="h-10 max-w-[190px] object-contain" />
    </div>

    <div class="px-4 py-6 flex-1 space-y-1.5 overflow-y-auto">
      <div class="px-3 pb-2 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
        Módulos del Sistema
      </div>

      <a routerLink="/dashboard/inicio"
        routerLinkActive="bg-[#0091CA]/10 text-[#0091CA] font-semibold border-r-4 border-[#0091CA]"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
        </svg>
        <span>Inicio</span>
      </a>

      <a routerLink="/dashboard/cliente"
        routerLinkActive="bg-[#0091CA]/10 text-[#0091CA] font-semibold border-r-4 border-[#0091CA]"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
        <span>Clientes</span>
      </a>

      <a routerLink="/dashboard/ordenes"
        routerLinkActive="bg-[#0091CA]/10 text-[#0091CA] font-semibold border-r-4 border-[#0091CA]"
        class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all duration-150">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span>Órdenes</span>
      </a>
    </div>

    <div class="p-4 border-t border-slate-100 bg-slate-50/50 space-y-3">
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-full bg-[#0091CA] text-white flex items-center justify-center font-bold text-xs uppercase shadow-sm">
          {{ userName().slice(0, 2) }}
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold text-slate-900 truncate">{{ userName() }}</div>
          <div class="text-[11px] text-slate-500 truncate">{{ userEmail() }}</div>
        </div>
      </div>

      <button (click)="onLogout()"
        class="w-full flex items-center justify-center gap-2 py-2 px-3 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg transition-colors duration-150 border border-rose-200/60 cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <div class="pl-64 flex-1 flex flex-col min-w-0">
    <header
      class="h-20 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-20 shadow-xs">
      <div>
        <div class="text-xs font-medium text-slate-400">Torres y Torres • Sistema de Gestión</div>
        <h2 class="text-lg font-bold text-slate-900">Panel Operativo</h2>
      </div>

      <div class="flex items-center gap-4">

      </div>
    </header>

    <main class="flex-1 p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
